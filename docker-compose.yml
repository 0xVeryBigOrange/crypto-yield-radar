services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keymint
      POSTGRES_PASSWORD: keymint
      POSTGRES_DB: keymint
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keymint -d keymint"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - keymint-pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://keymint:keymint@db:5432/keymint
      SESSION_SECRET: dev-session-secret-change-me
      ADMIN_TOKEN: dev-admin-token
      CRON_SECRET: dev-cron-secret
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
      UPSTREAM_PROVIDER: openrouter
      UPSTREAM_BASE_URL: https://openrouter.ai/api/v1
      APP_PUBLIC_URL: http://localhost:3000
      APP_NAME: 橙签
      LLM_MODEL: openai/gpt-4o-mini
      MARKUP: "1.3"
      MIN_DEPOSIT_USD: "1"
      PORT: "3000"
      NODE_ENV: development

volumes:
  keymint-pg:
