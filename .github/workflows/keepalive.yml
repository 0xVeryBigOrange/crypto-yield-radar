name: keepalive

on:
  schedule:
    # Render free web services sleep after 15 minutes without traffic.
    # A health check every 10 minutes keeps the instance awake so the first
    # visitor is not the one who has to wait through a cold start.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          # APP_URL is the same secret the daily job uses. The public URL is the
          # fallback already published in render.yaml, so a missing secret still pings.
          base="${APP_URL:-https://keymint-1106.onrender.com}"
          base="${base%/}"
          case "${base}" in
            http://*|https://*) ;;
            *)
              echo "APP_URL must start with http:// or https://."
              exit 1
              ;;
          esac
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code=$(curl --silent --show-error --output /tmp/keymint-healthz.json --write-out '%{http_code}' \
              --connect-timeout 20 --max-time 90 \
              "${base}/healthz" || true)
            if [ "${code}" = "200" ]; then
              ok=1
              break
            fi
            echo "Attempt ${attempt} returned HTTP ${code}; waiting for the free instance."
            sleep 10
          done
          if [ "${ok}" != "1" ]; then
            echo "Health check did not succeed."
            exit 1
          fi
          echo "Health check ok."
