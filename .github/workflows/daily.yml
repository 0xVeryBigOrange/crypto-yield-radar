name: daily

on:
  schedule:
    # 00:15 UTC = 08:15 Asia/Singapore, and after the US cash close.
    # The Singapore day itself flips at 00:00 on the first request.
    # This run warms today's 橙签 and the next US session's 盘前橙签.
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the web service and run the daily job
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Set repository secrets APP_URL and CRON_SECRET."
            exit 1
          fi
          case "${APP_URL}" in
            http://*|https://*) ;;
            *)
              echo "APP_URL must start with http:// or https://."
              exit 1
              ;;
          esac
          base="${APP_URL%/}"
          # Free Render instances sleep after 15 minutes. This POST wakes one.
          # Each attempt has its own budget so a proxy 502 during cold start can be retried.
          # The secret stays in the environment and is not printed.
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl --silent --show-error --output /tmp/keymint-daily.json --write-out '%{http_code}' \
              --connect-timeout 20 --max-time 120 \
              -X POST "${base}/internal/daily" \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Accept: application/json" || true)
            if [ "${code}" = "200" ]; then
              ok=1
              break
            fi
            if [ "${code}" = "401" ]; then
              echo "CRON_SECRET was rejected."
              exit 1
            fi
            if [ "${code}" = "503" ] && grep -q cron_disabled /tmp/keymint-daily.json; then
              echo "CRON_SECRET is not set on the web service."
              exit 1
            fi
            echo "Attempt ${attempt} returned HTTP ${code}; waiting for the free instance."
            sleep 15
          done
          if [ "${ok}" != "1" ]; then
            echo "Daily job did not succeed."
            exit 1
          fi
          echo "Daily job finished."
          python3 -c 'import json; d=json.load(open("/tmp/keymint-daily.json")); print({k:d.get(k) for k in ("ok","day","usSession","models","priceRefresh","omen")})'
