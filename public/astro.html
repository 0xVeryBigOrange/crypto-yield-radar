<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星座 — 橙签</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="astro">
  <header class="topbar">
    <a class="brand" href="/"><span class="seal" aria-hidden="true"></span><span>橙签</span></a>
    <a class="balance-chip" href="/account" data-balance>登录</a>
  </header>
  <main class="wrap">
    <p class="eyebrow">每日更新</p>
    <h1>星座</h1>
    <p class="lede">今日运势免费。深度 10 橙币。配对免费看分数，深度 20 橙币。</p>
    <label class="stack"><span>星座</span><select id="sign"></select></label>
    <div id="result"></div>
    <form id="match-form" class="stack panel">
      <h2>配对</h2>
      <label><span>甲方</span><select id="left"></select></label>
      <label><span>乙方</span><select id="right"></select></label>
      <button class="btn" type="submit">看合盘</button>
    </form>
    <footer class="site-footer"><p>仅供娱乐，不构成投资、法律、医疗或心理建议。</p></footer>
  </main>
  <nav class="tabbar" aria-label="牌桌">
    <a href="/">今日</a>
    <a href="/play" aria-current="page">玩法</a>
    <a href="/collection">图鉴</a>
    <a href="/account">我的</a>
  </nav>
  <script src="/ui.js"></script>
  <script src="/plays.js"></script>
</body>
</html>
