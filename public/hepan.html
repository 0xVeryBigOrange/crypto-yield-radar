<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合盘 — 橙签</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="hepan">
  <header class="topbar">
    <a class="brand" href="/"><span class="seal" aria-hidden="true"></span><span>橙签</span></a>
    <a class="balance-chip" href="/account" data-balance>登录</a>
  </header>
  <main class="wrap">
    <p class="eyebrow">合盘</p>
    <h1>跟谁坐一张桌子</h1>
    <p class="lede">和大橙子合盘，或者把链接丢给朋友。分数免费，深度解读 20 橙币。邀请链接用 ?ref= ，朋友注册双方得橙币，不是返佣。</p>
    <section class="panel" id="invite"></section>
    <h2>和大橙子</h2>
    <div id="orange-result"></div>
    <h2>邀请码</h2>
    <form id="code-form" class="stack">
      <label><span>朋友的邀请码</span><input id="with-code" name="code" autocomplete="off"></label>
      <button class="btn" type="submit">合一下</button>
    </form>
    <div id="code-result"></div>
    <h2>两个地址</h2>
    <form id="pair-form" class="stack">
      <label><span>地址一</span><input name="left" placeholder="公开地址" required></label>
      <label><span>地址二</span><input name="right" placeholder="另一个公开地址" required></label>
      <button class="btn-ghost" type="submit">看两个地址的缘</button>
    </form>
    <div id="pair-result"></div>
    <footer class="site-footer">
      <p>牌桌主人 <a href="https://x.com/0xVeryBigOrange">@0xVeryBigOrange</a></p>
      <p>仅供娱乐，不构成投资、法律、医疗或心理建议。</p>
    </footer>
  </main>
  <nav class="tabbar" aria-label="牌桌">
    <a href="/">今日</a>
    <a href="/play" aria-current="page">玩法</a>
    <a href="/collection">图鉴</a>
    <a href="/account">我的</a>
  </nav>
  <script src="/ui.js"></script>
</body>
</html>
