<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塔罗提问 — 橙签</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="ask">
  <header class="topbar">
    <a class="brand" href="/"><span class="seal" aria-hidden="true"></span><span>橙签</span></a>
    <a class="balance-chip" href="/account" data-balance>登录</a>
  </header>
  <main class="wrap">
    <p class="eyebrow">塔罗提问</p>
    <h1>问心情，别问点位</h1>
    <p class="lede">三张牌的基础解读免费，不用登录。深度解读 20 橙币。想自己点牌，去<a href="/tarot">塔罗牌阵</a>。交易问题会被扭回心情。</p>
    <form id="ask-form" class="stack">
      <label><span>你的问题</span><textarea name="question" maxlength="200" required placeholder="例如：这周盯盘我为什么这么烦"></textarea></label>
      <label class="ack"><input name="ack" type="checkbox"> 我已知晓：虚拟服务一经交付不予退款。仅供娱乐，不构成投资、法律、医疗或心理建议。</label>
      <div class="btn-row">
        <button class="btn-ghost" type="submit" data-tier="free">免费三张</button>
        <button class="btn" type="submit" data-tier="full">深度解读</button>
      </div>
      <p class="msg" id="ask-msg"></p>
    </form>
    <div id="ask-result"></div>
    <footer class="site-footer"><p>仅供娱乐，不构成投资、法律、医疗或心理建议。</p></footer>
  </main>
  <nav class="tabbar" aria-label="牌桌">
    <a href="/">今日</a>
    <a href="/play" aria-current="page">玩法</a>
    <a href="/collection">图鉴</a>
    <a href="/account">我的</a>
  </nav>
  <script src="/ui.js"></script>
</body>
</html>
