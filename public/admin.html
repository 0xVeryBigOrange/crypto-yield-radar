<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>管理 — 橙签</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="seal" aria-hidden="true"></span><span>橙签</span></a>
    <a class="text-link" href="/account">我的</a>
  </header>
  <main class="wrap">
    <section id="gate" class="panel">
      <h1>管理</h1>
      <p class="fine">令牌是服务器上的 ADMIN_TOKEN，只留在这个标签页。</p>
      <form id="gate-form" class="stack">
        <label><span>管理令牌</span><input id="admin-token" type="password" autocomplete="off" required></label>
        <button class="btn" type="submit">进入</button>
        <p class="msg" id="gate-msg"></p>
      </form>
    </section>
    <section id="panel" class="hidden">
      <div id="stats" class="grid"></div>
      <form id="adjust-form" class="stack panel">
        <h2>调整余额</h2>
        <label><span>邮箱</span><input name="email" type="email" required></label>
        <label><span>增减（负数是扣）</span><input name="deltaUsd" required></label>
        <label><span>原因</span><input name="reason" required minlength="3"></label>
        <button class="btn" type="submit">提交</button>
        <p class="msg" id="adjust-msg"></p>
      </form>
      <p><button type="button" class="btn-ghost" id="refresh">刷新今日橙签和汇总</button></p>
      <p class="msg" id="refresh-msg"></p>
      <article class="panel"><h2>用户</h2><div class="table-wrap"><table><thead><tr><th>外号</th><th>邮箱</th><th>余额</th><th>月卡</th></tr></thead><tbody id="user-body"></tbody></table></div></article>
      <article class="panel"><h2>充值</h2><div class="table-wrap"><table><thead><tr><th>邮箱</th><th>链</th><th>金额</th><th>交易</th></tr></thead><tbody id="deposit-body"></tbody></table></div></article>
      <article class="panel"><h2>每日汇总</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>牌面</th><th>消费</th><th>充值</th></tr></thead><tbody id="summary-body"></tbody></table></div></article>
    </section>
    <footer class="site-footer"><p>仅供娱乐，不构成投资、法律、医疗或心理建议。</p></footer>
  </main>
  <script src="/admin.js"></script>
</body>
</html>
