# 橙签 / OrangeOmens on Render's free tier.
# The Blueprint service name stays `keymint` and the database stays `keymint-db`
# so syncing updates the existing service (public URL https://keymint-1106.onrender.com)
# instead of creating a second one. The daily job is GitHub Actions POSTing /internal/daily.
# Free Postgres expires about 30 days after creation.
version: "1"

envVarGroups:
  - name: keymint-config
    envVars:
      - key: UPSTREAM_API_KEY
        sync: false
      - key: UPSTREAM_PROVIDER
        value: openrouter
      - key: UPSTREAM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: APP_PUBLIC_URL
        value: https://keymint-1106.onrender.com
      - key: APP_NAME
        value: 橙签
      # Kept so an existing Blueprint sync does not drop values. The app no longer reads them.
      - key: MARKUP
        value: "1.3"
      - key: MIN_DEPOSIT_USD
        value: "5"
      - key: DEFAULT_RPM
        value: "60"
      - key: RESERVE_BUFFER
        value: "1.25"
      - key: DEFAULT_MAX_COMPLETION
        value: "1024"
      - key: MIN_CONFIRMATIONS_ETH
        value: "12"
      - key: MIN_CONFIRMATIONS_BSC
        value: "15"
      - key: ETH_RPC_URL
        value: https://ethereum.publicnode.com
      - key: BSC_RPC_URL
        value: https://bsc.publicnode.com

databases:
  - name: keymint-db
    databaseName: keymint
    user: keymint
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: keymint
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - fromGroup: keymint-config
      - key: DATABASE_URL
        fromDatabase:
          name: keymint-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
